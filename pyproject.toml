[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tio-suite"
version = "0.1.0"
description = "tio-server: shared serial-port gateway with MCP, admin UI and ttyd bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "tio-suite contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyserial>=3.5",
  "argon2-cffi>=23",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
  "mcp>=2.3,<3",
  "tomli-w>=1.0",
  "regex>=2024.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyinstaller>=6.6",
]

[project.scripts]
tio-server = "tio_server.cli:main"
tio-mcp = "tio_mcp_shim.__main__:main"
tio-web-bridge = "tio_web_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tio_server", "src/tio_mcp_shim", "src/tio_web_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
